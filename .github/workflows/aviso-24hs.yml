name: Aviso automático 24hs - Mar del Tuyú

on:
  schedule:
    # 09:00 hora Argentina = 12:00 UTC (Argentina no tiene horario de verano)
    - cron: '0 12 * * *'
  workflow_dispatch: {} # permite dispararlo manualmente desde la pestaña "Actions" en GitHub, para probar

jobs:
  enviar-aviso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: automation
        run: npm install

      - name: Ejecutar aviso de 24hs
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: node aviso24hs.js
