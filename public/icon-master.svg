<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background: full-bleed square. iOS/Android apply their own corner
       mask on top, so the source stays square to avoid a double border. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- House silhouette (property) -->
  <path d="M256 118 L 366 206 V 318 H 146 V 206 Z"
        fill="#f8fafc" opacity="0.95"/>
  <path d="M256 118 L 386 220 L 366 244 L 256 156 L 146 244 L 126 220 Z"
        fill="#f8fafc"/>

  <!-- Door -->
  <rect x="232" y="256" width="48" height="62" rx="4" fill="#0c4a6e"/>

  <!-- Waves under the house (three bars, echoing the app's Waves icon) -->
  <path d="M96 356 Q 136 336 176 356 T 256 356 T 336 356 T 416 356"
        stroke="url(#wave1)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M96 396 Q 136 376 176 396 T 256 396 T 336 396 T 416 396"
        stroke="url(#wave1)" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M96 436 Q 136 416 176 436 T 256 436 T 336 436 T 416 436"
        stroke="url(#wave1)" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
